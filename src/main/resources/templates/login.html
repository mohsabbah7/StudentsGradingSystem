<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 360px;
        }
        h1 { color: #4facfe; margin-bottom: 8px; text-align: center; font-size: 28px; }
        p { text-align: center; color: #aaa; margin-bottom: 28px; font-size: 14px; }
        label { display: block; margin-bottom: 16px; color: #555; font-size: 14px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: #4facfe; }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: 600;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
<div class="card">
    <h1>🎓 Students App</h1>
    <p>Login to manage your students</p>
    <form th:action="@{/login}" method="post">
        <label>Username <input type="text" name="username" placeholder="Enter username"/></label>
        <label>Password <input type="password" name="password" placeholder="Enter password"/></label>
        <button type="submit">Login →</button>
    </form>
</div>
</body>
</html>
