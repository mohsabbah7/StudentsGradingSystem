<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f9ff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 750px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { color: #4facfe; font-size: 30px; }
        .logout {
            color: #4facfe;
            text-decoration: none;
            font-size: 14px;
            border: 2px solid #4facfe;
            padding: 6px 14px;
            border-radius: 8px;
        }
        .add-form {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }
        .add-form h2 { color: #555; margin-bottom: 16px; font-size: 16px; }
        .form-row { display: flex; gap: 12px; }
        .add-form input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }
        .add-form input:focus { border-color: #4facfe; }
        .add-form button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 12px;
        }
        table {
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-collapse: collapse;
            overflow: hidden;
        }
        thead { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }
        th { padding: 14px 20px; text-align: left; font-size: 14px; }
        td { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; color: #444; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f0f9ff; }
        .grade {
            font-weight: 700;
            color: #4facfe;
        }
        .btn-delete {
            padding: 6px 14px;
            background: #f44336;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎓 Students</h1>
        <a href="/logout" class="logout">🚪 Logout</a>
    </div>

    <div class="add-form">
        <h2>➕ Add New Student</h2>
        <form th:action="@{/students/add}" method="post">
            <div class="form-row">
                <input type="text" name="name" placeholder="Student name"/>
                <input type="number" name="grade" placeholder="Grade (0-100)" step="0.1"/>
            </div>
            <button type="submit">Add Student ✚</button>
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Grade</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td class="grade" th:text="${student.grade}"></td>
            <td><a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn-delete">❌ Delete</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
